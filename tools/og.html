<!doctype html>
<!-- Source for assets/img/og.jpg. Regenerate with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --window-size=1200,630 --screenshot=og.png tools/og.html
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #2b2e31; color: #f3f4f1; font-family: "Archivo", sans-serif; display: flex; flex-direction: column; }
  .tape { height: 22px; background: repeating-linear-gradient(-45deg, #f2c230 0 26px, #2b2e31 26px 52px); }
  .inner { flex: 1; padding: 44px 64px 0; display: flex; flex-direction: column; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: #aeb5b0; margin: 0 0 14px; }
  h1 { margin: 0; font-size: 104px; font-weight: 900; font-variation-settings: "wdth" 72; line-height: .9; letter-spacing: -.02em; text-transform: uppercase; }
  h1 span { color: #f2c230; }
  .facts { display: flex; gap: 1px; background: #4a4e52; border: 1px solid #4a4e52; border-radius: 12px; overflow: hidden; margin-top: 32px; }
  .facts div { background: #3a3d40; padding: 14px 22px; flex: 1 1 auto; }
  .facts dt { font-family: "IBM Plex Mono", monospace; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: #aeb5b0; }
  .facts dd { margin: 4px 0 0; font-size: 30px; font-weight: 700; white-space: nowrap; }
  .facts dd.num { font-family: "IBM Plex Mono", monospace; color: #f2c230; }
  .plan { margin-top: auto; height: 118px; background: url(../assets/img/projeto-planta.jpg) center / cover; border-radius: 12px 12px 0 0; }
</style>
</head>
<body>
  <div class="tape"></div>
  <div class="inner">
    <p class="kicker">Pinheiros · São Paulo · documentos públicos</p>
    <h1>A obra de 2026 na<br><span>Praça Benedito Calixto</span></h1>
    <dl class="facts">
      <div><dt>Valor do contrato</dt><dd class="num">R$ 1.439.886,76</dd></div>
      <div><dt>Empresa</dt><dd>Progredior</dd></div>
      <div><dt>Prazo</dt><dd>01 Set → 31 Dez</dd></div>
    </dl>
    <div class="plan"></div>
  </div>
</body>
</html>
